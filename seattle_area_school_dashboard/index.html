<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seattle Area School Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #f3efe4;
      --panel: #fffaf0;
      --ink: #1a2433;
      --accent: #0e6a72;
      --accent-2: #dd6b20;
      --border: #d7ccb7;
    }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top right, rgba(221,107,32,0.18), transparent 35%),
        linear-gradient(180deg, #f9f3e7 0%, var(--bg) 100%);
    }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }
    .hero, .panel {
      background: rgba(255,250,240,0.92);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(26,36,51,0.08);
    }
    .hero {
      padding: 28px;
      margin-bottom: 24px;
    }
    .hero h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 3vw, 3.2rem);
    }
    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
    }
    .panel {
      padding: 20px;
    }
    .checkbox-list {
      display: grid;
      gap: 8px;
      max-height: 320px;
      overflow: auto;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    button {
      background: var(--accent);
      color: white;
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      cursor: pointer;
    }
    button.secondary {
      background: var(--accent-2);
    }
    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <p>Starter dashboard scaffold</p>
      <h1>Seattle Area School Dashboard</h1>
      <p>This placeholder site demonstrates the intended GitHub Pages output. Replace the sample data payload with normalized NCES exports as the pipeline is implemented.</p>
    </section>
    <div class="layout">
      <section class="panel">
        <h2>Districts</h2>
        <div id="districts" class="checkbox-list"></div>
        <div class="toolbar">
          <button id="select-all">Select all</button>
          <button id="clear-all" class="secondary">Clear all</button>
        </div>
      </section>
      <section class="panel">
        <h2>Enrollment Trend</h2>
        <canvas id="trendChart" height="120"></canvas>
      </section>
    </div>
  </main>
  <script>
    const districtGroups = {"puget_sound_core": ["Seattle", "Bellevue", "Renton", "Issaquah", "Snoqualmie Valley", "Lake Washington", "Mercer Island", "Bainbridge Island", "North Kitsap", "Central Kitsap", "Vashon Island"]};
    const districts = [...districtGroups.puget_sound_core];
    const container = document.getElementById('districts');

    districts.forEach((district, index) => {
      const label = document.createElement('label');
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.value = district;
      input.checked = index < 3;
      label.appendChild(input);
      label.append(' ' + district);
      container.appendChild(label);
    });

    document.getElementById('select-all').addEventListener('click', () => {
      container.querySelectorAll('input').forEach((input) => { input.checked = true; });
    });
    document.getElementById('clear-all').addEventListener('click', () => {
      container.querySelectorAll('input').forEach((input) => { input.checked = false; });
    });

    new Chart(document.getElementById('trendChart'), {
      type: 'line',
      data: {
        labels: ['2020', '2021', '2022', '2023', '2024'],
        datasets: [
          {
            label: 'Sample enrollment',
            data: [420, 430, 436, 440, 447],
            borderColor: '#0e6a72',
            backgroundColor: 'rgba(14,106,114,0.2)',
            tension: 0.2,
          }
        ]
      }
    });
  </script>
</body>
</html>
