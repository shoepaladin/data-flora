name: Build and Deploy Dashboard

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seattle_area_school_dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Build static dashboard
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/build_dashboard.py

      - name: Refresh OSPI metrics
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python scripts/refresh_ospi_metrics.py

      - name: Commit refreshed data
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git -C .. add seattle_area_school_dashboard/site/dashboard-data.json
          git -C .. diff --cached --quiet || git -C .. commit -m "Refresh OSPI metrics data [skip ci]"
          git -C .. push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: seattle_area_school_dashboard/site

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
