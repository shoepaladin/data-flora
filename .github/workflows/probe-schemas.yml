name: Probe OSPI Dataset Schemas

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seattle_area_school_dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e . -q
      - name: Run schema probe
        run: python scripts/probe_ospi_schemas.py
